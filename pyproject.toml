[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subiculum-rnn"
version = "0.0.01"
description = "Do axis-of-travel-like representations emerge in a vanilla RNN trained to predict future position?"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kyle Shannon", email = "kyle@kmshannon.com" }, { name = "Jiesen Zhang", email = "jiz147@ucsd.edu" }]
# Runtime imports of the package itself. The full research environment
# (PyTorch, RatInABox, plotting, ...) is pinned in pixi.toml / pixi.lock.
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "pydantic>=2.5",
  "xarray>=2023.6",
  "zarr>=3,<4",
]

[project.scripts]
subiculum-rnn = "subiculum_rnn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subiculum_rnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
